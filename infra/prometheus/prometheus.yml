global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-book
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: order-book
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
